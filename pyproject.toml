[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vibe-octo"
version = "4.0.0"
description = "Vibe Marketing with OCTO — multi-agent AI consultant for TELUS campaign management"
requires-python = ">=3.11"
dependencies = [
    # API + data
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    # Pydantic validation (all agents + pydantic_schemas)
    "pydantic>=2.5.0",
    # BigQuery + Google Auth (Nexus, Quant, knowledge ingestion)
    "google-cloud-bigquery>=3.11.0",
    "google-auth>=2.23.0",
    # PDF extraction (brief fetcher)
    "pdfplumber>=0.10.0",
    # HTTP API server (web front end)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # AI reasoning -- Gemini via Vertex AI
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "hitl*", "agents*", "api*"]

[project.scripts]
vibe-octo = "vibe_orchestrator:main"
