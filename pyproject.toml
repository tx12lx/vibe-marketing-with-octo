[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vibe-octo"
version = "4.0.0"
description = "Vibe Marketing with OCTO — multi-agent AI consultant for TELUS campaign management"
requires-python = ">=3.11"
dependencies = [
    # API + data
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    # Pydantic validation (all agents + pydantic_schemas)
    "pydantic>=2.5.0",
    # BigQuery + Google Auth (Nexus, Quant, knowledge ingestion)
    "google-cloud-bigquery>=3.11.0",
    "google-auth>=2.23.0",
    # PDF extraction (brief fetcher)
    "pdfplumber>=0.10.0",
    # Numpy for optional dense-embedding cosine similarity
    "numpy>=1.26.0",
    # Phase 4: HTTP API server (shared by Slack and Google Chat interfaces)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Phase 4: Slack interface (active)
    "slack-bolt>=1.18.0",
    # Phase 4: Google Chat interface (preserved, activate when GCP permissions resolved)
    "google-api-python-client>=2.118.0",
    # AI reasoning -- Gemini via Vertex AI (replaces Fuel iX)
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "knowledge_base*", "schema_discovery*", "hitl*", "tools*", "agents*", "api*"]

[project.scripts]
vibe-octo = "vibe_orchestrator:main"
vibe-ingest = "knowledge_base.vibe_octo_knowledge:main"
