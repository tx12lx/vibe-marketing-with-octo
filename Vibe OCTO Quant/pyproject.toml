[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bq-reporter"
version = "0.1.0"
description = "Translate plain English to BigQuery SQL and format results for Google Chat"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery>=3.0.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
bq-reporter = "bq_reporter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bq_reporter*"]
