<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Marketing with OCTO</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand:        #4B2E8C;
  --brand-dark:   #3C2370;
  --bg:           #F7F6FA;
  --surface:      #FFFFFF;
  --border-mid:   rgba(74, 60, 110, 0.2);
  --txt:          #1A1523;
  --txt-2:        #6B6880;
  --r-md: 10px;
  --r-lg: 14px;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--txt);
  background: var(--bg);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-card {
  width: 100%;
  max-width: 340px;
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 28px 26px;
  box-shadow: 0 2px 16px rgba(26, 21, 35, 0.08);
}

.login-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.login-sub   { font-size: 12px; color: var(--txt-2); margin-bottom: 18px; line-height: 1.5; }

.login-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-mid);
  border-radius: var(--r-md);
  font-size: 14px;
  color: var(--txt);
  background: var(--bg);
  margin-bottom: 12px;
}

.login-input:focus { outline: none; border-color: var(--brand); }

.login-btn {
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: var(--r-md);
  background: var(--brand);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.login-btn:hover { background: var(--brand-dark); }

.login-error {
  font-size: 12px;
  color: #A33030;
  margin-bottom: 12px;
}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-title">Vibe Marketing with OCTO</div>
  <div class="login-sub">This is a shared pilot tool. Enter the access password you were given to continue.</div>
  {{ERROR}}
  <form method="post" action="/login">
    <input class="login-input" type="password" name="password" placeholder="Access password" autofocus required>
    <button class="login-btn" type="submit">Enter</button>
  </form>
</div>
</body>
</html>
